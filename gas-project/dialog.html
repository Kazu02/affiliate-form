<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Hiragino Sans", "Meiryo", sans-serif; font-size: 14px; padding: 24px; background: #fff; }
  h2 { font-size: 16px; color: #3730a3; margin-bottom: 20px; }
  .field { margin-bottom: 16px; }
  label { display: block; font-weight: bold; color: #374151; margin-bottom: 6px; }
  label span { color: #ef4444; margin-left: 2px; }
  input[type=text], input[type=url] { width: 100%; padding: 8px 10px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 14px; outline: none; }
  input:focus { border-color: #4f46e5; box-shadow: 0 0 0 2px rgba(79,70,229,0.15); }
  .hint { font-size: 11px; color: #9ca3af; margin-top: 4px; }
  .opts { border: 1px solid #e5e7eb; border-radius: 6px; padding: 12px 14px; background: #f9fafb; margin-bottom: 16px; }
  .opts .row { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 8px; }
  .opts .row:last-child { margin-bottom: 0; }
  .opts input[type=checkbox] { margin-top: 3px; }
  .opts label { font-weight: normal; margin-bottom: 0; color: #374151; }
  .opts .sub { margin-left: 22px; }
  .actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 24px; }
  button { padding: 8px 20px; border-radius: 6px; font-size: 14px; cursor: pointer; border: none; }
  #btnCancel { background: #f3f4f6; color: #374151; }
  #btnCreate { background: #4f46e5; color: #fff; font-weight: bold; }
  #btnCreate:disabled { background: #a5b4fc; cursor: not-allowed; }
  #msg { margin-top: 12px; font-size: 13px; color: #ef4444; min-height: 18px; }
  #msgOk { color: #16a34a; }
  #steps { margin-top: 12px; font-size: 12px; color: #374151; line-height: 1.7; }
  #steps .ng { color: #ef4444; font-weight: bold; }
  #steps .note { color: #9ca3af; }
</style>
</head>
<body>
<h2>新規フォーム作成</h2>

<div id="form">
  <div class="field">
    <label>フォーム記号（シート名・URL用）<span>*</span></label>
    <input id="formCode" type="text" placeholder="例：anken_a">
    <div class="hint">半角英数字とアンダースコアのみ。フォームURLに含まれます。</div>
  </div>

  <div class="field">
    <label>フォーム名（表示用）</label>
    <input id="formDisplayName" type="text" placeholder="例：○○キャンペーン">
    <div class="hint">日本語OK。報告メッセージや管理シートで使われます。</div>
  </div>

  <div class="field">
    <label>フォームタイトル<span>*</span></label>
    <input id="formTitle" type="text" placeholder="例：○○キャンペーン申請フォーム">
  </div>

  <div class="field">
    <label>アフィリエイトURL<span>*</span></label>
    <input id="affiliateUrl" type="url" placeholder="https://...">
  </div>

  <div class="field">
    <label>代理店コード（任意）</label>
    <input id="agencyCode" type="text" placeholder="例：kn, ab_001">
    <div class="hint">半角英数字とアンダースコアのみ。空欄は自社直営業として扱われます。</div>
  </div>

  <div class="opts" id="opts">
    <div class="row">
      <input id="activate" type="checkbox" checked onchange="toggleAgency()">
      <label for="activate">作成と同時に稼働させる<br>
        <span class="hint">案件マスタに追加して稼働ON、設定タブを表示、SS2と顧客管理に案件列を追加します。</span>
      </label>
    </div>
    <div class="row sub">
      <input id="giveToAgencies" type="checkbox" checked>
      <label for="giveToAgencies">代理店にも渡す<br>
        <span class="hint">外すと取扱案件マトリクスを「渡さない」で作ります（翌朝の案内メールにも載りません）。</span>
      </label>
    </div>
  </div>

  <div id="msg"></div>

  <div class="actions">
    <button id="btnCancel" onclick="google.script.host.close()">キャンセル</button>
    <button id="btnCreate" onclick="submit()">作成する</button>
  </div>
</div>

<div id="result" style="display:none">
  <div id="resultMsg" style="color:#16a34a; font-weight:bold;"></div>
  <div id="steps"></div>
  <div class="actions">
    <button id="btnClose" onclick="google.script.host.close()">閉じる</button>
  </div>
</div>

<script>
function toggleAgency() {
  var on = document.getElementById("activate").checked;
  var ag = document.getElementById("giveToAgencies");
  ag.disabled = !on;
  if (!on) ag.checked = false;
}

function submit() {
  const formCode        = document.getElementById("formCode").value.trim();
  const formDisplayName = document.getElementById("formDisplayName").value.trim();
  const formTitle       = document.getElementById("formTitle").value.trim();
  const affiliateUrl    = document.getElementById("affiliateUrl").value.trim();
  const agencyCode      = document.getElementById("agencyCode").value.trim();
  const activate        = document.getElementById("activate").checked;
  const giveToAgencies  = document.getElementById("giveToAgencies").checked;
  const msg             = document.getElementById("msg");

  if (!formCode || !formTitle || !affiliateUrl) {
    msg.textContent = "必須項目（*）をすべて入力してください。";
    msg.id = "msg";
    return;
  }
  if (!/^[a-zA-Z0-9_]+$/.test(formCode)) {
    msg.textContent = "フォーム記号は半角英数字とアンダースコアのみ使用できます。";
    msg.id = "msg";
    return;
  }
  if (agencyCode && !/^[a-zA-Z0-9_]+$/.test(agencyCode)) {
    msg.textContent = "代理店コードは半角英数字とアンダースコアのみ使用できます。";
    msg.id = "msg";
    return;
  }

  msg.textContent = "作成中... 案件マスタ・SS2・顧客管理まで反映するので30秒ほどかかります。";
  msg.id = "msg";
  document.getElementById("btnCreate").disabled = true;

  google.script.run
    .withSuccessHandler(showResult)
    .withFailureHandler(function(err) {
      msg.id = "msg";
      msg.textContent = err.message || "エラーが発生しました。";
      document.getElementById("btnCreate").disabled = false;
    })
    .createFormFromDialog({
      formCode:        formCode,
      formDisplayName: formDisplayName,
      formTitle:       formTitle,
      affiliateUrl:    affiliateUrl,
      agencyCode:      agencyCode,
      activate:        activate,
      giveToAgencies:  giveToAgencies
    });
}

// 後処理は1段ずつ独立して走るので、どこまで通ったかをそのまま見せる。
// 失敗した段はメニューから単体で押し直せるため、黙って閉じない。
function showResult(result) {
  const setup = result.setup || {};
  const steps = setup.steps || [];
  document.getElementById("form").style.display = "none";
  document.getElementById("result").style.display = "block";
  document.getElementById("resultMsg").textContent =
    "「" + (result.formDisplayName || result.formCode) + "」を作成しました。";

  let html = "";
  if (setup.skipped) {
    html += '<div class="note">' + setup.skipped + "</div>";
  }
  steps.forEach(function (s) {
    html += s.ok
      ? "OK " + s.label + (s.detail ? '<span class="note"> — ' + s.detail + "</span>" : "") + "<br>"
      : '<span class="ng">NG ' + s.label + " — " + s.detail + "</span><br>";
  });
  if (steps.length) {
    html += '<div class="note">申請状況一覧の件数表示は日次で作り直されます（すぐ反映したいときはメニュー「申請状況一覧を作り直す」）。</div>';
  }
  if (setup.failed) {
    html += '<div class="ng">失敗した項目はメニューから単体で実行し直してください。</div>';
  }
  document.getElementById("steps").innerHTML = html;
}
</script>
</body>
</html>
